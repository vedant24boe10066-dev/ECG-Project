services:
  - type: web
    name: ecg-recording-analysis
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/models
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: MPLCONFIGDIR
        value: /tmp/ecg-matplotlib
      - key: MPLBACKEND
        value: Agg
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
